name: Build Arcane Arts

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Show environment
        run: java -version

      - name: Build mod
        run: gradle build --no-daemon --stacktrace --console=plain

      - name: Upload jar artifact
        uses: actions/upload-artifact@v4
        with:
          name: arcanearts-mod
          path: build/libs/*.jar
          if-no-files-found: error

      - name: Create nightly release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: nightly
          name: "Arcane Arts — Nightly Build"
          body: "Автоматическая сборка мода из последнего коммита main."
          prerelease: true
          files: build/libs/*.jar
