plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}

version = '1.0.0'
group = 'com.arcanearts'

base {
    archivesName = 'arcanearts'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

neoForge {
    version = '21.1.252'

    mods {
        arcanearts {
            sourceSet sourceSets.main
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

jar {
    manifest {
        attributes([
                'Implementation-Title'   : 'Arcane Arts',
                'Implementation-Version': project.version,
                'Implementation-Vendor' : 'ArcaneArts'
        ])
    }
}
